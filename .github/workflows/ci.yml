# Tests on every pull request and branch push (tags are tested by release.yml and docker.yml).
#   linux:   the server side (internal/..., cmd/..., web) and frontend checks;
#   windows: everything, the desktop app (root package) included.
name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: |
          go vet ./internal/... ./cmd/... ./web
          go test ./internal/... ./cmd/... ./web
          node web/tests/i18n.test.js
          node web/tests/analytics.test.js

      - name: Verify server build versions
        run: |
          go build -trimpath -o "$RUNNER_TEMP/rltracker-server-version" ./cmd/rltracker-server
          test "$("$RUNNER_TEMP/rltracker-server-version" --version)" = dev
          go build -trimpath -ldflags '-X rocket-tracker/internal/buildinfo.Version=1.2.3' -o "$RUNNER_TEMP/rltracker-server-version" ./cmd/rltracker-server
          test "$("$RUNNER_TEMP/rltracker-server-version" --version)" = 1.2.3

  windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: |
          go vet ./...
          go test ./...
          node web/tests/i18n.test.js
          node web/tests/analytics.test.js

      - name: Verify desktop build versions
        run: |
          go build -trimpath -o "$RUNNER_TEMP/rltracker-version.exe" .
          test "$("$RUNNER_TEMP/rltracker-version.exe" version | tr -d '\r')" = dev
          go build -trimpath -ldflags '-X rocket-tracker/internal/buildinfo.Version=1.2.3' -o "$RUNNER_TEMP/rltracker-version.exe" .
          test "$("$RUNNER_TEMP/rltracker-version.exe" version | tr -d '\r')" = 1.2.3
