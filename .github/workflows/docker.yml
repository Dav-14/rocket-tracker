# Builds the server image (Dockerfile) and pushes it to the homelab Harbor.
# Repository secrets: HARBOR_USERNAME / HARBOR_PASSWORD (a Harbor robot account
# with push rights on the my-apps project).
name: Docker image

on:
  push:
    branches: [main, self-hosted]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: harbor.virgilebaisnee.fr
  IMAGE: harbor.virgilebaisnee.fr/my-apps/rocket-tracker

jobs:
  # The checks that run on Linux (same as ci.yml); the image is only pushed when they pass.
  # The root package (desktop app) is Windows-only: its tests run in release.yml / ci.yml.
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: |
          go vet ./internal/... ./cmd/... ./web
          go test ./internal/... ./cmd/... ./web
          node devtools/i18n_test.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version without the tag's leading "v" (v0.19.0 -> 0.19.0), as release.yml does.
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
